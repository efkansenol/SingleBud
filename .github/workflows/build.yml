name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build
        run: gradle --no-daemon assembleStandardDebug assembleLegacyDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/standard/debug/*.apk out/SingleBud.apk
          cp app/build/outputs/apk/legacy/debug/*.apk out/SingleBud-legacy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SingleBud-apk
          path: out/*.apk

      # Keeps one "latest" release so the APK can be downloaded straight from a phone.
      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest out/SingleBud.apk out/SingleBud-legacy.apk \
            --target "$GITHUB_SHA" \
            --title "SingleBud (latest build)" \
            --notes "Built automatically from $GITHUB_SHA. SingleBud.apk is the normal build (Shizuku or root). SingleBud-legacy.apk must be installed with: adb install --bypass-low-target-sdk-block SingleBud-legacy.apk"
